info:
  name: Task example
  type: http
  seq: 5

http:
  method: GET
  url: http://localhost:5080/fhir/Task?patient={{nin}}&_count=20&_offset=0
  params:
    - name: patient
      value: "{{nin}}"
      type: query
    - name: _count
      value: "20"
      type: query
    - name: _offset
      value: "0"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
