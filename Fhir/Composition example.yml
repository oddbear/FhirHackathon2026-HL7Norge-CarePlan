info:
  name: Composition example
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:5080/fhir/Composition?patient={{nin}}&_count=20
  params:
    - name: patient
      value: "{{nin}}"
      type: query
    - name: _count
      value: "20"
      type: query
    - name: _offset
      value: "20"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
