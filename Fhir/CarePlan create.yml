info:
  name: CarePlan create
  type: http
  seq: 15

http:
  method: POST
  url: http://localhost:5080/fhir/CarePlan
  headers:
    - name: Content-Type
      value: application/fhir+json
  body:
    type: json
    data: |-
      {
        "resourceType": "CarePlan",
        "status": "draft",
        "intent": "plan",
        "title": "title",
        "description": "personal_goals",
        "subject": {
          "identifier": { "system": "urn:oid:2.16.578.1.12.4.1.4.1", "value": "01660188378" }
        },
        "note": [ { "text": "comment" } ],
        "contained": [
          {
            "resourceType": "ServiceRequest", "id": "z1", "status": "draft", "intent": "plan",
            "subject": { "display": "patient" },
            "category": [ { "coding": [ { "code": "green" } ] } ],
            "code": { "concept": { "text": "action" } },
            "reason": [ { "concept": { "text": "conditio" } } ]
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Same as plan/Create a new plan, in FHIR form. Creates a plan (upstream POST /plan). Zones are contained ServiceRequests with category code green, yellow or red, code.text as action and reason.concept.text as condition. Returns 201 with the CarePlan.
