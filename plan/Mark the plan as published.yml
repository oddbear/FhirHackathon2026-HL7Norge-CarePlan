info:
  name: Mark the plan as published
  type: http
  seq: 10
  tags:
    - plan

http:
  method: POST
  url: "{{baseUrl}}/plan/:id/$mark-published"
  params:
    - name: id
      value: 083fb223-c63a-4721-8dd2-ebc8ca0723bc
      type: path
      description: Plan ID
  body:
    type: json
    data: |-
      {
        "comment": "comment 4",
        "revision": 4,
        "version": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

