info:
  name: Search plans
  type: http
  seq: 1
  tags:
    - plan

http:
  method: GET
  url: "{{baseUrl}}/plan?patient={{nin}}"
  params:
    - name: patient
      value: "{{nin}}"
      type: query
      description: Patient NIN (required)
    - name: is_active
      value: "true"
      type: query
      description: Filter by active status (true/false)
      disabled: true
    - name: updated_since
      value: ""
      type: query
      description: Filter by updated since (RFC3339 timestamp)
      disabled: true
    - name: published
      value: ""
      type: query
      description: Filter by publication status (true/false)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

