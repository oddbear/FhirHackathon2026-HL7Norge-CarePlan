info:
  name: Get plan by version
  type: http
  seq: 15
  tags:
    - plan

http:
  method: GET
  url: "{{baseUrl}}/plan/:id/version/:version"
  params:
    - name: id
      value: ""
      type: path
      description: Plan ID
    - name: version
      value: ""
      type: path
      description: Version number
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

