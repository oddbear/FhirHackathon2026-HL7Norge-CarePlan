info:
  name: Create a new plan
  type: http
  seq: 2
  tags:
    - plan

http:
  method: POST
  url: "{{baseUrl}}/plan"
  body:
    type: json
    data: |-
      {
        "clinical_content": {
          "personal_goals": "personal_goals",
          "title": "title",
          "zones": [
            {
              "action": "action",
              "condition": "conditio",
              "level": "green"
            }
          ]
        },
        "comment": "comment",
        "subject": {
          "nin": "01660188378"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    description: Created
    request:
      url: "{{baseUrl}}/plan"
      method: POST
      body:
        type: json
        data: |-
          {
            "clinical_content": {
              "personal_goals": "",
              "title": "",
              "zones": [
                {
                  "action": "",
                  "condition": "",
                  "level": "green"
                }
              ]
            },
            "comment": "",
            "subject": {
              "nin": ""
            }
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "revision": 0
          }
