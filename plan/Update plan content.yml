info:
  name: Update plan content
  type: http
  seq: 12
  tags:
    - plan

http:
  method: POST
  url: "{{baseUrl}}/plan/:id/$update-content"
  params:
    - name: id
      value: ""
      type: path
      description: Plan ID
  body:
    type: json
    data: |-
      {
        "clinical_content": {
          "personal_goals": "",
          "title": "",
          "zones": [
            {
              "action": "",
              "condition": "",
              "level": "green"
            }
          ]
        },
        "comment": "",
        "revision": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

